<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">2026<br>ARCHIVE</div>
    <nav>
      <a href="#about">ABOUT</a>
      <a href="#works">WORKS</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-title">
        <h1>LIVE<br>ARCHIVE</h1>
      </div>
      <div class="hero-info">
        <p>13 SELECTED<br>POSTERS</p>
        <p>2022 — 2026<br>MUSIC / CULTURE</p>
      </div>
    </section>

    <section id="about" class="about">
      <div class="section-number">01</div>
      <div class="about-content">
        <h2>ABOUT</h2>
        <p class="about-text">
          음악과 공연, 그리고 그 순간을 기록한<br>
          13개의 포스터 아카이브입니다.
        </p>
        <div class="about-info">
          <div><span>COLLECTION</span><strong>13 POSTERS</strong></div>
          <div><span>PERIOD</span><strong>2022 — 2026</strong></div>
          <div><span>TYPE</span><strong>MUSIC / CULTURE</strong></div>
        </div>
      </div>
    </section>

    <section id="works" class="works">
      <div class="works-header">
        <div class="section-number">02</div>
        <h2>WORKS</h2>
        <div class="filter">
          <button class="filter-btn active" data-category="all">ALL</button>
          <button class="filter-btn" data-category="artist">ARTIST</button>
          <button class="filter-btn" data-category="event">EVENT</button>
        </div>
      </div>
      <div class="work-grid" id="workGrid"></div>
    </section>

    <footer>
      <div class="footer-title">SEE<br>YOU<br>THERE.</div>
      <div class="footer-info">
        <p>2026 ARCHIVE</p>
        <p>13 POSTERS<br>MUSIC / CULTURE</p>
      </div>
    </footer>
  </main>

  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">CLOSE ×</button>
    <div class="modal-inner">
      <div class="modal-image"><img id="modalImage" src="" alt=""></div>
      <div class="modal-info">
        <span class="modal-category" id="modalCategory"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-designer" id="modalDesigner"></p>
        <p class="modal-description" id="modalDescription"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
